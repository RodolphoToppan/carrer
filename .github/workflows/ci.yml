name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        run: |
          head_sha=$(git rev-parse HEAD)
          printf 'HEAD=%s\n' "$head_sha"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::HEAD does not match github.sha"
            exit 1
          fi
          status=$(git status --short --untracked-files=all)
          printf 'git status --short:\n%s\n' "$status"
          if [[ -n "$status" ]]; then
            echo "::error::Working tree is not clean after checkout"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            .github/requirements-ci.txt

      - name: Audit execution identity and runtime
        run: |
          printf 'actor=%s\n' "$GITHUB_ACTOR"
          printf 'triggering_actor=%s\n' "${GITHUB_TRIGGERING_ACTOR:-unavailable}"
          printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
          printf 'ref=%s\n' "$GITHUB_REF"
          printf 'ref_name=%s\n' "$GITHUB_REF_NAME"
          printf 'sha=%s\n' "$GITHUB_SHA"
          printf 'repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'runner_os=%s\nrunner_arch=%s\nrunner_name=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "$ImageOS" "$ImageVersion"
          python --version

      - name: Create isolated environment
        run: |
          python -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pip install --no-build-isolation -c .github/requirements-ci.txt -e ".[dev]"
          python -m pip check

      - name: Lint with ruff
        run: |
          python -m ruff check src/ scripts/ tests/

      - name: Check formatting with ruff
        run: |
          python -m ruff format --check src/ scripts/ tests/

      - name: Type check with mypy
        run: |
          python -m mypy src/carrer/

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v --basetemp="${RUNNER_TEMP}/carrer-pytest-quality"
